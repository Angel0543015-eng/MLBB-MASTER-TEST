<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>MLBB MASTER • Resultado</title>

<style>
*{
box-sizing:border-box;
}

body{
margin:0;
font-family:Arial,sans-serif;
background:#080b16;
color:#fff;
padding:20px;
}

.container{
max-width:700px;
margin:auto;
}

.header{
background:linear-gradient(135deg,#171333,#111c3b);
border:1px solid #3d4670;
border-radius:24px;
padding:35px 22px;
margin-bottom:20px;
text-align:center;
}

.badge{
display:inline-block;
background:#29204f;
color:#bcaeff;
padding:7px 13px;
border-radius:30px;
font-size:12px;
font-weight:bold;
}

h1{
font-size:34px;
margin:15px 0 5px;
}

.subtitle{
color:#aeb7d5;
line-height:1.5;
}

.card{
background:#11172a;
border:1px solid #303957;
border-radius:20px;
padding:24px;
margin:16px 0;
}

input{
width:100%;
background:#0c1222;
color:#fff;
border:1px solid #303957;
border-radius:14px;
padding:16px;
font-size:17px;
outline:none;
margin:10px 0;
text-align:center;
}

input:focus{
border-color:#8068ff;
}

button{
width:100%;
border:0;
border-radius:15px;
padding:16px;
font-size:16px;
font-weight:bold;
color:#fff;
background:linear-gradient(90deg,#7658ff,#398cff);
cursor:pointer;
margin-top:8px;
}

.error{
color:#ff8c8c;
text-align:center;
margin-top:15px;
}

.result{
display:none;
text-align:center;
}

.player{
font-size:21px;
font-weight:bold;
margin:15px 0;
}

.score{
font-size:65px;
font-weight:900;
margin:15px 0;
}

.rank{
font-size:28px;
font-weight:bold;
margin-bottom:25px;
}

.stats{
display:grid;
grid-template-columns:1fr 1fr;
gap:12px;
}

.stat{
background:#181f35;
border:1px solid #303957;
border-radius:15px;
padding:18px;
}

.stat-title{
color:#aeb7d5;
font-size:13px;
margin-bottom:7px;
}

.stat-value{
font-size:22px;
font-weight:bold;
}

.pending{
color:#ffd66b;
line-height:1.6;
}

@media(max-width:500px){

.stats{
grid-template-columns:1fr;
}

h1{
font-size:28px;
}

.score{
font-size:55px;
}

}
</style>
</head>

<body>

<div class="container">

<div class="header">

<div class="badge">👑 MLBB MASTER TEST</div>

<h1>Consultar resultado</h1>

<div class="subtitle">
Introduce el código que recibiste después de completar tu examen.
</div>

</div>


<div class="card" id="searchCard">

<input
type="text"
id="resultCode"
placeholder="Ejemplo: MLBB-A82F91C3"
autocomplete="off"
>

<button id="searchButton">
🔎 VER MI RESULTADO
</button>

<div id="error" class="error"></div>

</div>


<div class="header result" id="result">

<div class="badge">
RESULTADO OFICIAL
</div>

<div class="player" id="playerName"></div>

<div class="score" id="score"></div>

<div class="rank" id="rank"></div>

<div class="stats">

<div class="stat">

<div class="stat-title">
SELECCIÓN MÚLTIPLE
</div>

<div class="stat-value" id="multipleScore">
-
</div>

</div>


<div class="stat">

<div class="stat-title">
RESPUESTAS LIBRES
</div>

<div class="stat-value" id="freeScore">
-
</div>

</div>

</div>

</div>

</div>


<script>

const SUPABASE_URL =
"https://sstwghkyoarubnrnfmxc.supabase.co";

const SUPABASE_KEY =
"sb_publishable_2TehQVkw3Ct29JuDxeivXQ_bYY4WWFZ";


document
.getElementById("searchButton")
.addEventListener(
"click",
async function(){

const code =
document
.getElementById("resultCode")
.value
.trim()
.toUpperCase();

const error =
document.getElementById("error");

error.innerText="";

if(!code){

error.innerText =
"Escribe tu código de resultado.";

return;

}

try{

const response =
await fetch(

SUPABASE_URL +
"/rest/v1/rpc/get_test_result",

{

method:"POST",

headers:{
"apikey":SUPABASE_KEY,
"Content-Type":
"application/json"
},

body:JSON.stringify({
code:code
})

}

);

if(!response.ok){

throw new Error(
"Error de conexión."
);

}

const data =
await response.json();

if(!data || data.length===0){

error.innerText =
"No encontramos un resultado con ese código o todavía no ha sido publicado.";

return;

}

const result =
data[0];

document
.getElementById("searchCard")
.style.display="none";

document
.getElementById("result")
.style.display="block";


document
.getElementById("playerName")
.innerText =
"👤 " + result.player_name;


document
.getElementById("score")
.innerText =
result.final_score + " / 100";


document
.getElementById("multipleScore")
.innerText =
result.multiple_score + " / 40";


document
.getElementById("freeScore")
.innerText =
result.free_score + " / 60";


const percentage =
Number(result.final_score);


let rank="";

if(percentage>=90){

rank="👑 MASTER";

}
else if(percentage>=75){

rank="💎 EXPERTO";

}
else if(percentage>=60){

rank="🥇 AVANZADO";

}
else if(percentage>=40){

rank="🥈 INTERMEDIO";

}
else{

rank="🥉 NOVATO";

}


document
.getElementById("rank")
.innerText=rank;

}
catch(error){

console.error(error);

document
.getElementById("error")
.innerText =
"No se pudo consultar el resultado.";

}

});

</script>

</body>
</html>
